<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Gallery</title>
    <style>
        :root {
            --background-color: #121212;
            --text-color: #e0e0e0;
            --card-color: #1e1e1e;
            --border-color: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 1rem;
        }

        /* Accessibility: Skip to content link */
        .skip-to-content {
            position: absolute;
            left: -10000px;
            top: auto;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }
        .skip-to-content:focus {
            position: static;
            width: auto;
            height: auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-weight: 300;
        }

        /* Responsive Media Grid */
        .media-grid {
            display: grid;
            /* Creates responsive columns: min 300px wide, max 1fr */
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }

        .media-card {
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            /* Aspect ratio for a consistent placeholder size before media loads */
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .media-card img,
        .media-card video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures media fills the card without distortion */
            display: block;
        }
    </style>
</head>

            const grid = document.getElementById('main-content');
            const imageExtensions = ['.gif', '.jpeg', '.jpg', '.png', '.webp'];
            const videoExtensions = ['.mp4', '.mov', '.webm'];

            mediaFiles.forEach(file => {
                const encodedFile = encodeURIComponent(file);
                const extension = file.substring(file.lastIndexOf('.')).toLowerCase();
                const card = document.createElement('div');
                card.className = 'media-card';

                if (imageExtensions.includes(extension)) {
                    const img = document.createElement('img');
                    img.src = encodedFile;
                    img.alt = file;
                    img.loading = 'lazy'; // Smart lazy loading for images
                    card.appendChild(img);
                } else if (videoExtensions.includes(extension)) {
                    const video = document.createElement('video');
                    video.src = encodedFile;
                    video.loop = true;
                    video.muted = true; // Autoplay requires video to be muted
                    video.playsInline = true;
                    video.preload = 'metadata'; // Smart: only load metadata initially
                    
                    // Allow user to unmute on click
                    video.addEventListener('click', () => {
                        video.muted = !video.muted;
                    });

                    card.appendChild(video);
                }
                grid.appendChild(card);
            });

            // Intersection Observer to play videos when they become visible
            const videos = document.querySelectorAll('video');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.play().catch(e => console.error("Autoplay failed:", e));
                    } else {
                        entry.target.pause();
                    }
                });
            }, { threshold: 0.5 }); // Trigger when 50% of the video is visible

            videos.forEach(video => observer.observe(video));
        });
